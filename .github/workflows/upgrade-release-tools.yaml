name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@5e8bf7d128a11823fb168415f22e3a9fac1614c8
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      groups: release
      python-version: "3.15"
      check-workflow: check.yaml
