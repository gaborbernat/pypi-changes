name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@3553fb1bb4ed1385f8b68571de1b5515edf2d339
    permissions:
      actions: write # Dispatch checks on the dependency branch.
      contents: write # Push the refreshed lock to that branch.
      pull-requests: write # Open or update its dependency PR.
    with:
      python-version: "3.15"
      check-workflow: check.yaml
