name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@60edc05324abc8e592818262dc63b36fb7b70f8c
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      groups: release
      python-version: "3.15"
      check-workflow: check.yaml
