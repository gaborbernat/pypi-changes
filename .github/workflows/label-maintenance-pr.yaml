name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] This workflow reads PR metadata without checkout or PR code.
    types: [opened, reopened, synchronize]
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  label:
    runs-on: ubuntu-26.04
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@5e8bf7d128a11823fb168415f22e3a9fac1614c8
        with:
          fragments: changelog.d,docs/changelog.d
