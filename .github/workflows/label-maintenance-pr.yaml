name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] This workflow reads PR metadata without checkout or PR code.
    types: [opened, reopened, synchronize]
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  label:
    runs-on: ubuntu-26.04
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@cc2680df515077c14581299f9c9f44c67481c139
        with:
          fragments: changelog.d,docs/changelog.d
