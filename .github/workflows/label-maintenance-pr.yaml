name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] This workflow reads PR metadata without checkout or PR code.
    types: [opened, reopened, synchronize]
permissions: {}
concurrency:
  group: label-news-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  label:
    name: Label bot changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write # Apply the skip news label.
      pull-requests: read # Inspect the PR author and changed files.
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
        with:
          fragments: changelog.d
