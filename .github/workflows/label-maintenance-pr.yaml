name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] This workflow reads PR metadata without checkout or PR code.
    types: [opened, reopened, synchronize]
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  label:
    runs-on: ubuntu-26.04
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@d5089c6f370857700c96a10c2711cee9112f4852
        with:
          fragments: changelog.d,docs/changelog.d
