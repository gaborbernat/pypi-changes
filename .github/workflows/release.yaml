name: Release to PyPI
on:
  push:
    tags: ["*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  dists-artifact-name: python-package-distributions
jobs:
  build:
    name: Validate tagged package
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@a32ce094895292b19eea422fc6500f1ef1ae8d5f
    permissions:
      contents: read
    with:
      changelog: CHANGELOG.md
      artifact-base-url: https://pypi.org/project/pypi-changes/
  previous_tag:
    name: Find previous release
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          set -euo pipefail
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync \
            --preview-features pylock \
            --python "$RUNNER_TEMP/release-tools/bin/python" \
            --group release \
            pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >> "$GITHUB_PATH"
      - name: Find previous tag
        id: previous
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "tag=$(git tag --list | release-creator tags "$TAG" --previous)" >>"$GITHUB_OUTPUT"
  contributor_metadata:
    name: Generate contributor notes
    needs: previous_tag
    runs-on: ubuntu-26.04
    permissions:
      contents: write # GitHub's generated-notes API requires Contents write.
    steps:
      - name: Generate contributor notes from the previous release
        if: needs.previous_tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.previous_tag.outputs.tag }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" -f previous_tag_name="$PREVIOUS" \
            --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - name: Generate contributor notes for the first release
        if: needs.previous_tag.outputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-release-notes
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
  github_notes:
    name: Render GitHub Release notes
    needs: contributor_metadata
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          set -euo pipefail
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync \
            --preview-features pylock \
            --python "$RUNNER_TEMP/release-tools/bin/python" \
            --group release \
            pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-release-notes
          path: ${{ runner.temp }}/generated-notes
      - uses: tox-dev/github-workflows/render-release-notes@a32ce094895292b19eea422fc6500f1ef1ae8d5f
        with:
          tag: ${{ github.ref_name }}
          changelog: CHANGELOG.md
          repository: ${{ github.repository }}
          artifact-url: https://pypi.org/project/pypi-changes/${{ github.ref_name }}/
          generated-notes: ${{ runner.temp }}/generated-notes/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  stage-github-release:
    name: Stage GitHub Release draft
    needs: github_notes
    runs-on: ubuntu-26.04
    permissions:
      contents: write # Create the draft before publishing to PyPI.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes
      - uses: tox-dev/github-workflows/publish-github-release@a32ce094895292b19eea422fc6500f1ef1ae8d5f
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes/release-notes.md
          mode: stage
  stage:
    name: Stage missing PyPI files
    needs: [build, stage-github-release]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      missing-count: ${{ steps.missing.outputs.missing-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/
      - id: missing
        uses: tox-dev/github-workflows/reconcile-pypi-artifacts@a32ce094895292b19eea422fc6500f1ef1ae8d5f
        with:
          project: pypi-changes
          version: ${{ github.ref_name }}
          dist: dist/
          mode: stage
          missing-dir: ${{ runner.temp }}/pypi-missing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-missing-manifest
          path: ${{ steps.missing.outputs.manifest }}
          if-no-files-found: error
  release:
    name: Publish to PyPI
    needs: [stage, stage-github-release, github_notes]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/pypi-changes/${{ github.ref_name }}
    permissions:
      id-token: write # Publish through PyPI's trusted publisher.
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-missing-manifest
          path: ${{ runner.temp }}/pypi-missing-manifest
      - id: selected
        uses: tox-dev/github-workflows/select-pypi-artifacts@a32ce094895292b19eea422fc6500f1ef1ae8d5f
        with:
          dist: dist/
          manifest: ${{ runner.temp }}/pypi-missing-manifest/pypi-missing-names.txt
          output-dir: pypi-upload
          expected-count: ${{ needs.stage.outputs.missing-count }}
      - name: Publish to PyPI
        if: steps.selected.outputs.selected-count != '0'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-upload
          attestations: true
          skip-existing: true
  verify:
    name: Verify PyPI release
    needs: [release, stage-github-release]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@a32ce094895292b19eea422fc6500f1ef1ae8d5f
        with:
          project: pypi-changes
          version: ${{ github.ref_name }}
          dist: dist/
          mode: verify
  github-release:
    name: Publish GitHub Release
    needs: [verify, stage-github-release, github_notes]
    runs-on: ubuntu-26.04
    permissions:
      contents: write # Create or repair the GitHub Release after PyPI succeeds.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes
      - uses: tox-dev/github-workflows/publish-github-release@a32ce094895292b19eea422fc6500f1ef1ae8d5f
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes/release-notes.md
          mode: publish
