name: check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "0 8 * * *"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    name: Test ${{ matrix.env }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        env:
          - "3.15"
          - "3.15t"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
          - type
          - dev
          - pkg_meta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
          cache-dependency-glob: "pyproject.toml"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: Install Python
        if: startsWith(matrix.env, '3.') && matrix.env != '3.15'
        env:
          MATRIX_ENV: ${{ matrix.env }}
        run: uv python install --python-preference only-managed "$MATRIX_ENV"
      - name: Setup test suite
        env:
          MATRIX_ENV: ${{ matrix.env }}
        run: tox run -vv --notest --skip-missing-interpreters false -e "$MATRIX_ENV"
      - name: Run test suite
        env:
          MATRIX_ENV: ${{ matrix.env }}
          PYTEST_ADDOPTS: "-vv --durations=5"
        run: tox run --skip-pkg-install -e "$MATRIX_ENV"
  changelog:
    name: News fragment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          set -euo pipefail
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >> "$GITHUB_PATH"
      - uses: tox-dev/github-workflows/validate-news@3553fb1bb4ed1385f8b68571de1b5515edf2d339
  gate:
    name: Required checks pass
    if: always()
    needs: [test, changelog]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT_NAME" '
            all(
              to_entries[];
              .value.result == "success" or
              (.key == "changelog" and .value.result == "skipped" and $event != "pull_request")
            )
          ' <<< "$NEEDS_JSON"
