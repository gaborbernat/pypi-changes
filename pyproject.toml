[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.28",
  "python-sbom[hatch]>=0.1.2",
]

[project]
name = "pypi-changes"
import-names = [ "pypi_changes" ]
description = "Compare installed packages with the latest PyPI releases"
keywords = [
  "outdated",
  "packages",
  "pypi",
  "upgrades",
]
license = "MIT"
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
authors = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Utilities",
]
dynamic = [
  "readme",
  "version",
]
dependencies = [
  "humanize>=4.13",
  "packaging>=26.3",
  "platformdirs>=4.4",
  "pypi-simple>=1.8",
  "requests>=2.32.5",
  "requests-cache>=1.3.3",
  "rich>=15",
]
urls.Changelog = "https://github.com/gaborbernat/pypi-changes/blob/main/CHANGELOG.md"
urls.Homepage = "https://github.com/gaborbernat/pypi-changes"
urls.Source = "https://github.com/gaborbernat/pypi-changes"
urls.Tracker = "https://github.com/gaborbernat/pypi-changes/issues"
scripts.pypi-changes = "pypi_changes.__main__:main"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "pkg-meta" },
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "covdefaults>=2.3",
  "pytest>=8.4.2",
  "pytest-cov>=7.1",
  "pytest-mock>=3.15.1",
  "vcrpy>=9.2",
  "virtualenv>=21.14.5",
]
type = [
  "ty>=0.0.84",
  { include-group = "test" },
]
build = [
  "cython>=3",
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.28",
  "python-sbom[hatch]>=0.1.2",
  "setuptools>=80",
]
lint = [
  "pre-commit-uv>=4.2",
]
pkg-meta = [
  "check-wheel-contents>=0.6.3",
  "twine>=6.2",
  "uv>=0.12.22",
]
release-news = [
  "release-creator>=4.4",
  "towncrier",
]
release-notes = [
  "release-creator>=4.4",
]
release-prepare = [
  "prek",
  "release-creator>=4.4",
  "towncrier",
]

[tool.hatch]
version.source = "vcs"
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
metadata.hooks.fancy-pypi-readme.substitutions = [
  { pattern = '''(?x)
    (?<!!)\[(?P<label>[^\]]+)\]\( # Link text, excluding images
    (?P<path>\.github/CONTRIBUTING\.md|CHANGELOG\.md) # Repository files linked from the README
    \)
    ''', replacement = '[\g<label>](https://github.com/gaborbernat/pypi-changes/blob/main/\g<path>)' },
]
build.hooks.vcs.version-file = "src/pypi_changes/_version.py"
build.hooks.python-sbom = {}

[tool.uv]
dependency-groups.release-news = { requires-python = ">=3.15" }
dependency-groups.release-notes = { requires-python = ">=3.15" }
dependency-groups.release-prepare = { requires-python = ">=3.15" }

[tool.ruff]
line-length = 120
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "any-type",                                  # allow Any as type annotation
  "CPY",                                       # No copyright statements
  "DOC",                                       # no support
  "hardcoded-bind-all-interfaces",             # Possible binding to all interface
  "incorrect-blank-line-before-class",         # `one-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible
  "missing-trailing-comma",                    # Conflict with formatter
  "multi-line-summary-first-line",             # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible
  "non-empty-init-module",                     # `__init__` module should only contain docstrings and re-exports
  "single-line-implicit-string-concatenation", # Conflict with formatter
  "undocumented-magic-method",                 # undocumented-public-api (simplint SMP903) covers the public API instead
  "undocumented-public-class",                 # undocumented-public-api (simplint SMP903) covers the public API instead
  "undocumented-public-function",              # undocumented-public-api (simplint SMP903) covers the public API instead
  "undocumented-public-init",                  # undocumented-public-api (simplint SMP903) covers the public API instead
  "undocumented-public-method",                # undocumented-public-api (simplint SMP903) covers the public API instead
  "undocumented-public-nested-class",          # undocumented-public-api (simplint SMP903) covers the public API instead
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",                               # asserts allowed in tests≈
  "D",                                    # don't care about documentation in tests
  "FBT",                                  # don't care about booleans as positional arguments in tests
  "implicit-namespace-package",           # no implicit namespace
  "import-private-name",                  # allow private import
  "magic-value-comparison",               # Magic value used in comparison, consider replacing with a constant variable
  "pytest-fixture-autouse",               # shared setup fixtures are meant to apply to every test
  "subprocess-without-shell-equals-true", # `subprocess` call: check for execution of untrusted input
]
lint.isort = { known-first-party = [
  "pypi_changes",
], required-imports = [
  "from __future__ import annotations",
] }
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
skip = "*.yaml"
write-changes = true
count = true

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
environment.python-version = "3.15"

[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
paths.source = [
  "src",
  ".tox*/*/lib/python*/site-packages",
  ".tox*/pypy*/site-packages",
  ".tox*\\*\\Lib\\site-packages",
  "*/src",
  "*\\src",
]
report.fail_under = 98
report.omit = []
html.show_contexts = true
html.skip_covered = false

[tool.towncrier]
name = "pypi-changes"
directory = "changelog.d"
filename = "CHANGELOG.md"
template = "release_creator.fragments:template.jinja2"
title_format = false
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "change", name = "Changes", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "breaking", name = "Breaking changes", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
  { directory = "performance", name = "Performance", showcontent = true },
  { directory = "deprecation", name = "Deprecated", showcontent = true },
  { directory = "removal", name = "Removed", showcontent = true },
  { directory = "packaging", name = "Packaging", showcontent = true },
]

[tool.python-sbom]
supplier = { name = "Bernát Gábor", url = [ "https://bernat.tech" ] }

[tool.nab]
mode = "universal"
base-group = "project-runtime"
uploaded-prior-to = "P7D"
decision-order = "stable"
matrix.python = ">=3.15,<3.16"
matrix.platforms = [ "linux_x86_64" ]
# release-creator 4.4.0 needs a seven-day cutoff exception.
# expires 2026-11-24
packages.release-creator.uploaded-prior-to = 2026-11-02T21:45:00Z
# python-sbom 0.1.2 needs a seven-day cutoff exception.
# expires 2026-11-15
packages.python-sbom.uploaded-prior-to = 2026-11-08T17:54:00Z

[tool.simplint]
docstring-style = "rst"
